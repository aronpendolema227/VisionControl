spring.application.name=inventario

# ===============================
# SERVIDOR
# ===============================
server.port=8081

# ===============================
# POSTGRESQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=aron123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# HIKARI - POOL DE CONEXIONES
# ===============================
spring.datasource.hikari.pool-name=VisionControl-HikariPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Apagar logs SQL para mejorar rendimiento
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Recomendado para APIs REST
spring.jpa.open-in-view=false
